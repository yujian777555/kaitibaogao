name: Research simulator regression tests

on:
  push:
    branches: [pilot-a-stateful-recovery]
    paths:
      - "experiments/pilot_a_recovery/**"
      - "experiments/pilot_a3b/**"
      - ".github/workflows/research-simulator-regression.yml"
  pull_request:
    branches: [pilot-a-stateful-recovery]
    paths:
      - "experiments/pilot_a_recovery/**"
      - "experiments/pilot_a3b/**"
      - ".github/workflows/research-simulator-regression.yml"

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install numpy
      - name: Test pilot_a_recovery
        run: python -m unittest discover -s experiments/pilot_a_recovery -p "test_*.py" -v
      - name: Test pilot_a3b
        run: python -m unittest discover -s experiments/pilot_a3b -p "test_*.py" -v
      - name: Generate D-064-C formal scenario manifest candidate
        run: |
          mkdir -p "$RUNNER_TEMP/d064c"
          python experiments/pilot_a3b/formal_scenario_generator.py --outdir "$RUNNER_TEMP/d064c"
      - name: Upload D-064-C manifest candidate
        uses: actions/upload-artifact@v4
        with:
          name: d064c-formal-scenario-manifest-candidate
          path: |
            ${{ runner.temp }}/d064c/formal_scenario_manifest_candidate.json
            ${{ runner.temp }}/d064c/formal_scenario_manifest_report.md
          if-no-files-found: error

      - name: Independently audit D-078 per-family and per-scenario outcomes
        run: |
          mkdir -p "$RUNNER_TEMP/d079-audit"
          python experiments/pilot_a3b/d079_diagnostics.py --outdir "$RUNNER_TEMP/d079-audit"

      - name: Generate D-079 Train-only challenge-set candidate
        run: |
          mkdir -p "$RUNNER_TEMP/d079-challenge"
          python experiments/pilot_a3b/d079_challenge_generator.py --outdir "$RUNNER_TEMP/d079-challenge"

      - name: Upload D-079 audit and challenge candidate
        uses: actions/upload-artifact@v4
        with:
          name: d079-d078-audit-and-challenge-candidate
          path: |
            ${{ runner.temp }}/d079-audit/d079_d078_audit.json
            ${{ runner.temp }}/d079-audit/d079_d078_audit_report.md
            ${{ runner.temp }}/d079-audit/d078_scenario_diagnostics.csv
            ${{ runner.temp }}/d079-audit/d078_family_composition_diagnostics.csv
            ${{ runner.temp }}/d079-challenge/d079_challenge_manifest.json
            ${{ runner.temp }}/d079-challenge/d079_challenge_candidate_report.json
          if-no-files-found: error

      - name: Generate and lock-check D-085 development-only challenge
        run: python experiments/pilot_a3b/prefix_challenge_generator.py

      - name: Recompute D-085 mechanism and fixed-controller ceiling audits
        run: |
          mkdir -p "$RUNNER_TEMP/d085-mechanism"
          python experiments/pilot_a3b/prefix_mechanism_audit.py --outdir "$RUNNER_TEMP/d085-mechanism"
          python experiments/pilot_a3b/prefix_ceiling_audit.py --outfile "$RUNNER_TEMP/d085-fixed-controller-ceiling.json"

      - name: Upload D-085 development and mechanism evidence
        uses: actions/upload-artifact@v4
        with:
          name: d085-prefix-development-and-mechanism-audit
          path: |
            experiments/pilot_a3b/prefix_manifest_lock.json
            experiments/pilot_a3b/results/d085_prefix_challenge/prefix_challenge_manifest.json
            ${{ runner.temp }}/d085-mechanism/
            ${{ runner.temp }}/d085-fixed-controller-ceiling.json
          if-no-files-found: error

      - name: Generate and lock-check D-086 dependency challenge
        run: |
          mkdir -p "$RUNNER_TEMP/d086-challenge"
          python experiments/pilot_a3b/dependency_challenge.py --outdir "$RUNNER_TEMP/d086-challenge" --lock-path "$RUNNER_TEMP/d086-lock.json"

      - name: Recompute D-086 fixed-policy optimization-space gate
        run: python experiments/pilot_a3b/dependency_gate.py --manifest "$RUNNER_TEMP/d086-challenge/dependency_manifest.json" --outdir "$RUNNER_TEMP/d086-fixed-gate"

      - name: Upload D-086 development and fixed-policy evidence
        uses: actions/upload-artifact@v4
        with:
          name: d086-dependency-development-and-fixed-gate
          path: |
            ${{ runner.temp }}/d086-challenge/
            ${{ runner.temp }}/d086-lock.json
            ${{ runner.temp }}/d086-fixed-gate/
          if-no-files-found: error

      - name: Generate and lock-check D-087 independent Validation
        run: |
          mkdir -p "$RUNNER_TEMP/d087-validation"
          python experiments/pilot_a3b/d087_challenge.py --outdir "$RUNNER_TEMP/d087-validation" --lock-path "$RUNNER_TEMP/d087-lock.json"

      - name: Audit saved D-087 raw evidence without rerunning evaluation
        run: python experiments/pilot_a3b/d087_replication_audit.py

      - name: Upload D-087 manifest and independently audited evidence
        uses: actions/upload-artifact@v4
        with:
          name: d087-frozen-replication-regression-evidence
          path: |
            ${{ runner.temp }}/d087-validation/
            ${{ runner.temp }}/d087-lock.json
            experiments/pilot_a3b/results/d087_replication/
          if-no-files-found: error

