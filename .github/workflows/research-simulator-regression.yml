name: Research simulator regression tests

on:
  push:
    branches: [pilot-a-stateful-recovery]
    paths:
      - "experiments/pilot_a_recovery/**"
      - "experiments/pilot_a3b/**"
      - ".github/workflows/research-simulator-regression.yml"
  pull_request:
    branches: [pilot-a-stateful-recovery]
    paths:
      - "experiments/pilot_a_recovery/**"
      - "experiments/pilot_a3b/**"
      - ".github/workflows/research-simulator-regression.yml"

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install numpy
      - name: Test pilot_a_recovery
        run: python -m unittest discover -s experiments/pilot_a_recovery -p "test_*.py" -v
      - name: Test pilot_a3b
        run: python -m unittest discover -s experiments/pilot_a3b -p "test_*.py" -v
      - name: Generate D-064-C formal scenario manifest candidate
        run: |
          mkdir -p "$RUNNER_TEMP/d064c"
          python experiments/pilot_a3b/formal_scenario_generator.py --outdir "$RUNNER_TEMP/d064c"
      - name: Upload D-064-C manifest candidate
        uses: actions/upload-artifact@v4
        with:
          name: d064c-formal-scenario-manifest-candidate
          path: |
            ${{ runner.temp }}/d064c/formal_scenario_manifest_candidate.json
            ${{ runner.temp }}/d064c/formal_scenario_manifest_report.md
          if-no-files-found: error

      - name: Independently audit D-078 per-family and per-scenario outcomes
        run: |
          mkdir -p "$RUNNER_TEMP/d079-audit"
          python experiments/pilot_a3b/d079_diagnostics.py --outdir "$RUNNER_TEMP/d079-audit"

      - name: Generate D-079 Train-only challenge-set candidate
        run: |
          mkdir -p "$RUNNER_TEMP/d079-challenge"
          python experiments/pilot_a3b/d079_challenge_generator.py --outdir "$RUNNER_TEMP/d079-challenge"

      - name: Upload D-079 audit and challenge candidate
        uses: actions/upload-artifact@v4
        with:
          name: d079-d078-audit-and-challenge-candidate
          path: |
            ${{ runner.temp }}/d079-audit/d079_d078_audit.json
            ${{ runner.temp }}/d079-audit/d079_d078_audit_report.md
            ${{ runner.temp }}/d079-audit/d078_scenario_diagnostics.csv
            ${{ runner.temp }}/d079-audit/d078_family_composition_diagnostics.csv
            ${{ runner.temp }}/d079-challenge/d079_challenge_manifest.json
            ${{ runner.temp }}/d079-challenge/d079_challenge_candidate_report.json
          if-no-files-found: error

