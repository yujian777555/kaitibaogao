name: D-078 exploratory Train Validation pilot

on:
  push:
    branches: [pilot-a-stateful-recovery]
    paths:
      - "experiments/pilot_a3b/run_sbcg_matrix.py"
      - "experiments/pilot_a3b/sbcg_experiment.py"
      - "experiments/pilot_a3b/sbcg_runner.py"
      - "experiments/pilot_a3b/sbcg.py"
      - "experiments/pilot_a3b/ea.py"
      - "experiments/pilot_a3b/sbcg_config.json"
      - "79_D078_TRAIN_VALIDATION_EXPLORATORY_PILOT.md"
      - ".github/workflows/d078-train-validation-pilot.yml"

permissions:
  contents: write

jobs:
  train-validation-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install numerical dependency
        run: python -m pip install --disable-pip-version-check numpy

      - name: Require full regression suite before experiment
        run: python -m unittest discover -s experiments/pilot_a3b -p "test_*.py" -v

      - name: Run 14-arm Train/Validation exploratory pilot
        run: |
          python experiments/pilot_a3b/run_sbcg_matrix.py \
            --outdir experiments/pilot_a3b/results/d078_train_validation_pilot \
            --seeds 411,522,633 \
            --population 8 \
            --generations 5 \
            --initial-pool-size 60

      - name: Commit reproducible pilot outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/pilot_a3b/results/d078_train_validation_pilot
          if ! git diff --cached --quiet; then
            git commit -m "Store D-078 exploratory Train Validation pilot results"
            git push origin "HEAD:\${GITHUB_REF_NAME}"
          fi

      - name: Upload pilot outputs
        uses: actions/upload-artifact@v4
        with:
          name: d078-train-validation-exploratory-pilot
          path: |
            experiments/pilot_a3b/results/d078_train_validation_pilot/matrix_results.json
            experiments/pilot_a3b/results/d078_train_validation_pilot/matrix_report.md
          if-no-files-found: error
